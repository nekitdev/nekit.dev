name: build

on:
  push:
    branches:
      - main

env:
  IMAGE_PREFIX: ghcr.io/nekitdev

jobs:
  build:
    strategy:
      matrix:
        service: [dev, battery, serve]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            version: "26.04"
          - arch: arm64
            version: "26.04-arm"

    runs-on: ubuntu-${{ matrix.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE_PREFIX }}/nekit-${{ matrix.service }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=nekit-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nekit-${{ matrix.service }}-${{ matrix.arch }}

  merge:
    needs: build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: [nekit-dev, nekit-battery, nekit-serve]

    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}-arm64
