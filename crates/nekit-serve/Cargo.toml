[dependencies.clap]
workspace = true
features = ["default", "derive", "env"]

[dependencies.thiserror]
workspace = true
features = ["std"]

[dependencies.tokio]
workspace = true
features = ["full"]

[dependencies.tower-http]
workspace = true
features = ["fs"]
