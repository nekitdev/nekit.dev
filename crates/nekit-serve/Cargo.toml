[package]
name = "nekit-serve"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Serving static files."
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies.anyhow]
workspace = true
