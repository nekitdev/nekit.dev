[package]
name = "nekit-dev"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Personal website."
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies.bytesize]
workspace = true
features = ["std", "serde"]

[dependencies.dioxus]
workspace = true
features = ["default", "fullstack", "router"]

[dependencies.dioxus-sdk]
workspace = true
features = ["time"]

[dependencies.futures-channel]
workspace = true
features = ["std"]

[dependencies.futures-util]
workspace = true

[dependencies.gloo-events]
workspace = true
optional = true

[dependencies.jiff]
workspace = true
features = ["default", "serde", "js"]

[dependencies.non-empty-str]
workspace = true
features = ["std", "serde"]

[dependencies.pid1]
workspace = true
optional = true

[dependencies.refining]
workspace = true
features = ["default"]

[dependencies.reqwest]
workspace = true
features = ["default", "json"]

[dependencies.serde]
workspace = true
features = ["std", "derive"]

[dependencies.sysinfo]
workspace = true
optional = true
features = ["component", "system"]

[dependencies.thiserror]
workspace = true
features = ["std"]

[dependencies.wasm-bindgen]
workspace = true
optional = true
features = ["std"]

[dependencies.web-sys]
workspace = true
optional = true
features = [
    "std",
    "Document",
    "Element",
    "EventTarget",
    "KeyboardEvent",
    "Window",
]

[features]
default = ["web"]
web = [
    "dioxus/web",
    # keyboard events
    "dep:gloo-events",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
server = [
    "dioxus/server",
    # docker signals
    "dep:pid1",
    # system information
    "dep:sysinfo",
]
